AntiFeatures:
  NonFreeAssets:
    en-US: Images downloaded are not always libre.
  NonFreeNet:
    en-US: Depends on Bing Images.
Categories:
  - Multimedia
  - Wallpaper
License: MIT
AuthorName: Michael Mogenson
SourceCode: https://github.com/mogenson/bing-live-wallpaper
IssueTracker: https://github.com/mogenson/bing-live-wallpaper/issues

AutoName: Bing Live Wallpaper
Description: |-
  Bing Live Wallpaper fetches the Bing image of the day at 11 UTC every day and sets it as your wallpaper.

  Features:
  * Scales the image to the largest screen dimension and centers it automatically.
  * Redraws the image on screen layout change (e.g., screen rotation or unfolding foldables).
  * Designed for folding phones: supports setting independent live wallpapers on inner and outer screens.
  * Extremely lightweight with no background usage beyond the daily image fetch.

RepoType: git
Repo: https://github.com/mogenson/bing-live-wallpaper.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - yes
    # The build consumes the clj-android toolchain (android-clojure-plugin,
    # neko, runtime-core, runtime-repl, clojure-patched) as Gradle composite
    # builds: settings.gradle.kts auto-clones them from
    # https://github.com/clj-android into build/deps/ at configuration time.
    # All sources are fetched and built deterministically; release builds
    # exclude the nREPL server, the dynamic classloader, and .clj sources.
    scandelete:
      - build/deps

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
